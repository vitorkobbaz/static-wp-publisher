name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            wordpress: "6.5"
          - php: "8.3"
            wordpress: "7.0"
          - php: "8.3"
            wordpress: "7.1"
          - php: "8.4"
            wordpress: "7.1"
          - php: "8.5"
            wordpress: "7.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, mbstring, mysqli, zip
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer check
      - name: Plugin headers
        run: |
          grep -Eq "Requires PHP:[[:space:]]+8\.3" plugins/kobbaz-static-publisher/kobbaz-static-publisher.php
          grep -Eq "Requires at least:[[:space:]]+6\.5" plugins/kobbaz-static-publisher/kobbaz-static-publisher.php

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run test:js
      - run: npm run typecheck:e2e
